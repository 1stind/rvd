<header x-data="{ open: false }" class="sticky top-0 z-50 bg-navy/95 backdrop-blur border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between h-16">

      <a href="/" class="flex items-center gap-2 shrink-0">
        <img src="/static/img/rv.png" alt="Logo" class="w-8 h-8 rounded object-contain">
        <span class="font-display font-semibold tracking-wide text-white text-sm sm:text-base">
          RAJA VOTING <span class="text-brand-bright">DIGITAL</span>
        </span>
      </a>

      <nav class="hidden md:flex items-center gap-8 font-display text-sm uppercase tracking-wide text-white/80">
        <a href="/" class="hover:text-white transition-colors">Beranda</a>
        <a href="/events" class="hover:text-white transition-colors">Event</a>
        <a href="/admin/login" class="ml-2 px-4 py-2 rounded bg-brand hover:bg-brand-bright text-white transition-colors">Admin</a>
      </nav>

      <button @click="open = !open" class="md:hidden text-white p-2 -mr-2" aria-label="Buka menu">
        <svg x-show="!open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="open" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <nav x-show="open" x-cloak x-transition class="md:hidden pb-4 flex flex-col gap-1 font-display text-sm uppercase tracking-wide text-white/80">
      <a href="/" class="px-2 py-2.5 rounded hover:bg-white/5 hover:text-white">Beranda</a>
      <a href="/events" class="px-2 py-2.5 rounded hover:bg-white/5 hover:text-white">Event</a>
      <a href="/admin/login" class="px-2 py-2.5 rounded bg-brand text-white text-center mt-1">Admin</a>
    </nav>
  </div>
</header>
