{% extends "base.html" %}
{% block title %}Voting Ditutup — Web Voting Championship{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center px-4 sm:px-6 py-16">
  <div class="text-center max-w-md">
    <span class="w-14 h-14 rounded-2xl bg-gray-100 inline-flex items-center justify-center text-2xl mb-5">🔒</span>
    <h1 class="font-display font-semibold text-2xl sm:text-3xl text-navy mb-3">Voting Sedang Ditutup</h1>
    <p class="text-gray-500 leading-relaxed mb-4">
      Periode voting untuk <span class="font-medium text-navy">{{ event.name }}</span> belum dibuka atau sudah berakhir.
      Silakan kembali lagi nanti.
    </p>
    <a href="/events" class="inline-block px-6 py-3 rounded bg-brand hover:bg-brand-bright text-white transition-colors font-display uppercase tracking-wide text-sm">
      Lihat Event Lain
    </a>
  </div>
</section>
{% endblock %}
