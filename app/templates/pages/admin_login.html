{% extends "base.html" %}
{% block title %}Admin Login - Web Voting Championship{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 sm:px-6 py-16">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <span class="w-10 h-10 rounded bg-brand inline-flex items-center justify-center font-score text-lg text-white mb-4">W</span>
      <h1 class="font-display font-semibold text-2xl text-navy">Admin Login</h1>
      <p class="text-sm text-gray-400 mt-1">Masuk untuk mengelola event, tim, dan transaksi</p>
    </div>

    <form class="bg-white rounded-xl border border-gray-200 p-6 space-y-4"
          x-data="adminLogin()"
          @submit.prevent="submit()">

      <p x-show="error" x-cloak class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2" x-text="error"></p>

      <div>
        <label for="email" class="block text-sm font-medium text-navy mb-1.5">Email</label>
        <input id="email" type="email" x-model="email" required placeholder="admin@panitia.id"
               class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm focus:border-brand outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-navy mb-1.5">Kata Sandi</label>
        <input id="password" type="password" x-model="password" required placeholder="••••••••"
               class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm focus:border-brand outline-none">
      </div>

      <button type="submit" :disabled="loading"
              class="w-full px-4 py-2.5 rounded bg-brand hover:bg-brand-bright text-white transition-colors font-display uppercase tracking-wide text-sm disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!loading">Masuk</span>
        <span x-show="loading">Memproses…</span>
      </button>
    </form>
  </div>
</section>

<script>
function adminLogin() {
  return {
    email: '',
    password: '',
    loading: false,
    error: '',
    async submit() {
      this.loading = true;
      this.error = '';
      try {
        const res = await fetch('/api/v1/auth/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: this.email, password: this.password }),
        });
        const body = await res.json();
        if (!body.success) {
          this.error = body.message || 'Login gagal';
          return;
        }
        const token = body.data.access_token;
        localStorage.setItem('wvc_admin_token', token);
        window.location.href = '/admin';
      } catch (e) {
        this.error = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
      } finally {
        this.loading = false;
      }
    },
  };
}
</script>
{% endblock %}
