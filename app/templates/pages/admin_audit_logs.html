{% extends "admin_base.html" %}
{% block title %}Audit Logs - Web Voting Championship{% endblock %}

{% block admin_content %}

      <!-- LOADING STATE -->
      <div id="loading-state" class="flex items-center justify-center min-h-[50vh]">
        <p class="text-gray-400 text-sm">Memuat audit logs...</p>
      </div>

      <!-- AUDIT LOGS CONTENT (hidden until loaded) -->
      <div id="audit-logs-content" class="hidden space-y-6">

        <!-- FILTERS -->
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <h2 class="text-lg font-semibold text-gray-800">Semua Audit Logs</h2>
            <div class="flex flex-wrap gap-2">
              <input type="text" id="search-entity-id" placeholder="Cari Entity ID..." class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <input type="date" id="filter-start-date" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <input type="date" id="filter-end-date" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <select id="filter-action" onchange="loadAuditLogs()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">Semua Action</option>
                <option value="event.create">Event Create</option>
                <option value="event.update">Event Update</option>
                <option value="event.delete">Event Delete</option>
                <option value="team.create">Team Create</option>
                <option value="team.update">Team Update</option>
                <option value="team.delete">Team Delete</option>
                <option value="payment.create">Payment Create</option>
                <option value="admin.login">Admin Login</option>
              </select>
              <button onclick="loadAuditLogs()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Search</button>
            </div>
          </div>
        </div>

        <!-- AUDIT LOGS LIST -->
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="space-y-4" id="audit-logs-list">
            <p class="text-gray-400 text-sm text-center py-8">Belum ada audit logs.</p>
          </div>
        </div>

      </div>

      <!-- ERROR STATE -->
      <div id="error-state" class="hidden">
        <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
          <p class="text-red-600 text-sm" id="error-message">Gagal memuat audit logs</p>
          <button onclick="loadAuditLogs()" class="mt-3 px-4 py-2 bg-red-600 text-white rounded-lg text-sm hover:bg-red-700">
            Coba Lagi
          </button>
        </div>
      </div>


{% endblock %}


{% block scripts %}
<script>
(function() {
  const esc = window.adminEscapeHTML;
  const API_BASE = '/api/v1';

  function showId(el) {
    const e = document.getElementById(el);
    if (e) e.classList.remove('hidden');
  }

  function hideId(el) {
    const e = document.getElementById(el);
    if (e) e.classList.add('hidden');
  }

  async function api(path, options = {}) {
    const token = localStorage.getItem('wvc_admin_token') || '';
    const headers = Object.assign({
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
    }, options.headers || {});

    const res = await fetch(API_BASE + path, Object.assign({ headers }, options));
    if (res.status === 401) {
      localStorage.removeItem('wvc_admin_token');
      window.location.href = '/admin/login';
      return null;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json().catch(() => ({}));
  }

  function getActionLabel(action) {
    const map = {
      'event.create': 'membuat event',
      'event.update': 'mengubah event',
      'event.delete': 'menghapus event',
      'team.create': 'membuat peserta',
      'team.update': 'mengubah peserta',
      'team.delete': 'menghapus peserta',
      'payment.create': 'membuat pembayaran',
      'admin.login': 'masuk sebagai admin',
      'admin.logout': 'keluar dari admin',
    };
    return map[action] || action;
  }

  async function loadAuditLogs() {
    hideId('error-state');
    hideId('audit-logs-content');
    showId('loading-state');

    try {
      const action = document.getElementById('filter-action').value;
      const entityId = document.getElementById('search-entity-id').value.trim();
      const startDate = document.getElementById('filter-start-date').value;
      const endDate = document.getElementById('filter-end-date').value;

      let url = '/admin/audit-logs?limit=50&offset=0';
      if (action) url += '&action=' + encodeURIComponent(action);
      if (entityId) url += '&entity_id=' + encodeURIComponent(entityId);
      if (startDate) url += '&start_date=' + encodeURIComponent(startDate);
      if (endDate) url += '&end_date=' + encodeURIComponent(endDate);

      const data = await api(url);
      if (!data || !data.success) {
        throw new Error(data?.message || 'Gagal memuat log aktivitas');
      }

      const logs = data.data || [];
      const container = document.getElementById('audit-logs-list');

      if (!logs.length) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">Belum ada log aktivitas.</p>';
      } else {
        container.innerHTML = logs.map(function(log) {
          const time = log.created_at ? new Date(log.created_at).toLocaleString('id-ID') : '';
          const actor = log.actor_name || (log.actor_type ? log.actor_type.toLowerCase() : 'system');
          const detailStr = log.detail ? JSON.stringify(log.detail) : '';
          return '<div class="admin-audit-record">' +
            '<div>' +
              '<h3>' + esc(actor) + ' ' + esc(getActionLabel(log.action)) + '</h3>' +
              (log.entity_type ? '<p class="text-xs text-gray-500 mt-1">Objek: ' + esc(log.entity_type) + (log.entity_id ? ' (' + esc(log.entity_id) + ')' : '') + '</p>' : '') +
              (detailStr ? '<details><summary>Lihat rincian</summary><p>' + esc(detailStr) + '</p></details>' : '') +
              (log.ip_address ? '<p class="text-xs text-gray-400 mt-1">IP: ' + esc(log.ip_address) + '</p>' : '') +
            '</div><time>' + time + '</time>' +
          '</div>';
        }).join('');
      }

      hideId('loading-state');
      showId('audit-logs-content');
    } catch (e) {
      hideId('loading-state');
      document.getElementById('error-message').textContent = 'Gagal memuat log aktivitas: ' + e.message;
      showId('error-state');
    }
  }


  window.loadAuditLogs = loadAuditLogs;
  loadAuditLogs();
})();
</script>
{% endblock %}
